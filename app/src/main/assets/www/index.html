<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mühendislik Ofisi – Prototip</title>
<style>*{box-sizing:border-box}
:root{--ink:#1F2937;--muted:#4B5563;--line:#E5E7EB;--bg:#E9ECF1;--acc:#F2B705;--blue:#2563EB;--green:#15803D;--warn:#9A3412}
html,body{margin:0;background:#CBD5E1;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:84px}
.small{font-size:12px}.muted{color:var(--muted)}.muted2{color:#D1D5DB}.pos{color:var(--green)}.neg{color:#B91C1C}.warn{color:var(--warn)}.r{text-align:right}
.top{background:var(--ink);color:#F9FAFB;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:5}
.row1,.row2{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{display:flex;flex-direction:column}.brand b{font-size:15px}
.money{display:flex;flex-direction:column;align-items:flex-end}.money b{font-size:18px}.money b.neg{color:#FCA5A5}
#hDate{font-size:12px;font-weight:600;color:#D1D5DB;white-space:nowrap}
.speeds{display:flex;gap:4px}.speeds button{width:38px;height:40px;border:0;border-radius:8px;background:#374151;color:#F9FAFB;font-weight:700;display:flex;align-items:center;justify-content:center}
.speeds button.on{background:var(--acc);color:var(--ink)}
.endday{height:40px;padding:0 8px;white-space:nowrap;flex:none;border:2px solid var(--acc);border-radius:8px;background:transparent;color:#F9FAFB;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.rep{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px}.rep b{font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1}.bar.dark{background:#4B5563}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}.bar.dark i{background:var(--acc)}.bar i.green{background:var(--green)}
.scene{position:relative;aspect-ratio:1100/900;background:linear-gradient(180deg,#CBD5E1,#E2E8F0);overflow:hidden}
.scene .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.scenelabel{position:absolute;left:10px;top:10px;background:#fff;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;font-size:12px;box-shadow:0 2px 8px rgba(17,24,39,.12)}
.scenelabel b{font-size:14px}.scenelabel span{color:var(--muted)}
.trainbadge{position:absolute;left:10px;bottom:10px;right:10px;background:#FFF7ED;color:var(--warn);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.jobs{padding:12px;display:flex;flex-direction:column;gap:10px}
.secthead{display:flex;justify-content:space-between;align-items:baseline}.secthead h2{margin:0;font-size:16px}
#activeList{display:flex;flex-direction:column;gap:10px}
.jobcard{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.jobcard.locked{opacity:.7}.jobcard:active{border-color:var(--ink)}
.jrow{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.jrow .price{margin-left:auto;font-size:14px}
.jname{font-size:15px;font-weight:600}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.chip.blue{background:#DBEAFE;color:#1E40AF}.chip.amber{background:#FEF3C7;color:#92400E}.chip.orange{background:#FFEDD5;color:#9A3412}.chip.gray{background:var(--line);color:#374151}.chip.green{background:#DCFCE7;color:#166534}
.trade{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:12px}.trade .st{text-align:right;font-weight:600}
.prow{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600}
.lockt{display:flex;gap:4px;align-items:center;font-weight:600;color:#374151}
.empty{background:#fff;border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.link{border:0;background:none;color:var(--blue);font-weight:600;text-decoration:underline;padding:4px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:1px solid #D1D5DB;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.bottom button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;min-width:60px;min-height:52px;justify-content:center;border-radius:10px}
.badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:#DC2626;color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:520px}
#toasts{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;width:calc(100% - 24px);max-width:520px;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);max-width:560px;margin:0 auto}
.sheethead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}.sheethead h2{margin:0;font-size:17px;flex:1}
.iconbtn{width:44px;height:44px;border:0;background:#F3F4F6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px}
.sheetbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.sheetbody h3{margin:8px 0 0;font-size:14px}.sheetbody p{margin:0}.big{margin:0;font-size:19px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid #9CA3AF;background:#fff;font-weight:600;font-size:13px}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px}.kv b{text-align:right}
.workers{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:12px;padding:12px}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}.wrow>div:first-child{grid-column:1/-1}.wrow>div:first-child{display:flex;flex-direction:column}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:40px;height:40px;border:1px solid #9CA3AF;border-radius:8px;background:#fff;font-size:18px;font-weight:700}.stepper b{width:18px;text-align:center}
.summary{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.netbox{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px}.netbox b{font-size:20px}
.actions{display:flex;gap:10px;justify-content:flex-end}
.primary{min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:var(--ink);font-weight:700}
.secondary{min-height:48px;padding:0 16px;border:1px solid #9CA3AF;border-radius:10px;background:#fff;font-weight:600}
.primary.small,.secondary.small{min-height:44px;font-size:13px;align-self:flex-start}
.card{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.warnbg{background:#FFF7ED;color:var(--warn)}
.stats{display:flex;flex-wrap:wrap;gap:6px}.stat{font-size:12px;background:#F3F4F6;border-radius:8px;padding:4px 8px}
.itemcard{flex-direction:row;align-items:center}.itemcard img{width:84px;height:76px;object-fit:contain;background:#E2E8F0;border-radius:10px;flex:none}.itemcard>div{flex:1;display:flex;flex-direction:column;gap:6px}
.tiercard img{width:100%;max-height:220px;object-fit:contain;background:linear-gradient(180deg,#CBD5E1,#E2E8F0);border-radius:10px}.tiercard.cur{outline:2px solid var(--green)}
.log{font-size:13px;gap:6px}
.modalwrap{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}.modal h2{margin:0;font-size:18px}.modal p{margin:0;font-size:14px;line-height:1.45}
.start{padding:28px 18px;display:flex;flex-direction:column;gap:14px}.start h1{margin:0;font-size:26px}.start p{margin:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.field input{height:46px;border:1px solid #9CA3AF;border-radius:10px;padding:0 12px;font-size:16px}
.startcard{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}.startcard b{font-size:17px}.startcard span{font-size:13px;color:var(--muted);line-height:1.4}.startcard:hover{border-color:var(--acc)}

.lockdot{position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:5px;background:#9CA3AF}
.lockedcard{opacity:.75}
.tradelist{display:flex;flex-direction:column;gap:6px}
.bottom button{min-width:52px}

.fix{border:1px solid #FED7AA;background:#FFF7ED;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mh{margin:4px 0 0;font-size:14px}
.modal{max-height:86vh;overflow-y:auto}
.riskcard{gap:6px}

.staffstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:0;border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;min-height:44px;width:100%}
.schip{font-size:12px;background:#F3F4F6;border-radius:999px;padding:4px 10px}.schip i{font-style:normal;color:var(--warn);font-weight:600}
.stbl{width:100%;border-collapse:collapse;font-size:13px}.stbl th{font-size:11px;color:var(--muted);text-align:right;font-weight:600;padding:4px 2px}.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl td{text-align:right;padding:6px 2px;border-top:1px solid var(--line)}.stbl tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.grouphead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:4px}

.tasbox{background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tasopt{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#F9FAFB;border-radius:10px;padding:8px 10px;min-height:48px}
.tasopt>span{display:flex;flex-direction:column;gap:2px}.tasopt .r{align-items:flex-end}
.tasopt.on{border:2px solid var(--ink);background:#FFFBEB}
.stars{color:#D97706;font-size:12px;letter-spacing:1px}
.tasopt .r b{white-space:nowrap}
.chip.purple{background:#EDE9FE;color:#5B21B6}.chip.teal{background:#CCFBF1;color:#115E59}

.cashbox{border:1px solid #BBF7D0;background:#F0FDF4;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.cashbox.bad{border-color:#FECACA;background:#FEF2F2}
.prize{display:flex;flex-direction:column;gap:2px;background:#FEF3C7;border-radius:12px;padding:12px}.prize b{font-size:15px}.prize span{font-weight:700;color:var(--green)}
.perks{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
</style>
</head>

function pazarlikLv(S) { return S.player.pazarlik + (S.items.guest || S.tier >= 2 ? 1 : 0) + (repLevel(S.rep) >= 5 ? 1 : 0); }

function genJob(S, initial, forceOpen) {
  const lv = repLevel(S.rep);
  const pool = JOB_TEMPLATES.filter(t => forceOpen ? (t.rep <= lv && !(t.prog || []).some(p => !S.programs[p])) : t.rep <= lv + 1);
  const t = pick(pool);
  const acil = !t.hizli && RNG() < 0.25;
  let baz = round100(rnd(t.deger[0], t.deger[1]) * (acil ? 1.25 : 1));
  const sure = Math.max(t.hizli ? 1 : 2, Math.round(t.sure * (acil ? 0.75 : 1)));
  const job = {
    id: S.nextId++, tur: t.tur, ad: t.ad, rep: t.rep, acil, baz, sure,
    mal: round100(t.mal * rnd(0.95, 1.05)), fazlar: t.fazlar ? t.fazlar.map(f => ({ trade: f[0], ah: f[1] })) : null,
    ah: t.ah || 0, prog: t.prog || [], teminat: !!t.teminat, hizli: !!t.hizli, anahtar: !!t.anahtar, projeAh: t.projeAh || 0,
    kalan: t.hizli ? rint(1, 2) : initial ? rint(3, 6) : rint(2, 5), musteri: pick(MUSTERI),

const PAKET = { kaba: { ad: 'Kaba inşaat', trades: ['kalipci', 'demirci', 'betoncu', 'duvarci'] }, ince: { ad: 'İnce inşaat', trades: ['sivaci', 'seramikci', 'boyaci'] } };
const FIRMALAR = { kaba: ['Demirtaş Kalıp', 'Öz Beton', 'Toros Yapı', 'Kuzey Yapı', 'Tekin Yapı', 'Anadolu Taahhüt', 'Çelikkaya İnşaat'], ince: ['Ege İnce İşler', 'Mavi Dekorasyon', 'Başak Yapı', 'Aksu İnşaat', 'Yıldız Yapı', 'Ekin Taahhüt', 'Lale Dekorasyon'] };
const STAR_MOD = { 5: [0.97, 1.05], 4: [0.93, 1.05], 3: [0.88, 1.04], 2: [0.75, 1.02] };
function tasEligible(j) { return j.tur === 'saha' && (j.rep >= 2 || j.teminat); }
function genTasOffers(S, j) {
  if (!tasEligible(j)) return null;
  const toplamAh = j.fazlar.reduce((s, f) => s + f.ah, 0);
  const out = {};
  for (const [k, p] of Object.entries(PAKET)) {
    const fz = j.fazlar.filter(f => p.trades.includes(f.trade)); if (!fz.length) continue;
    const ah = fz.reduce((s, f) => s + f.ah, 0);
    const iscilik = fz.reduce((s, f) => s + f.ah * TRADES[f.trade].gunluk / HOURS_PER_DAY * 1.12, 0);
    const pay = j.sure * ah / toplamAh;
    const names = FIRMALAR[k].slice().sort(() => RNG() - 0.5);
    out[k] = [5, 3 + (RNG() < 0.5 ? 1 : 0), 2].map((y, i) => {
      const fiyatK = y === 5 ? rnd(1.12, 1.28) : y === 4 ? rnd(1.0, 1.12) : y === 3 ? rnd(0.92, 1.05) : rnd(0.78, 0.9);
      const gunK = y === 5 ? rnd(0.78, 0.9) : y >= 3 ? rnd(0.86, 0.98) : rnd(0.92, 1.08);
      return { ad: names[i], yildiz: y, fiyat: round100(iscilik * fiyatK), gun: Math.max(1, Math.round(pay * gunK)) };
    });
  }
  return out;
}
function tasGroupOf(trade) { return PAKET.kaba.trades.includes(trade) ? 'kaba' : 'ince'; }
function tasPower(j, tasSel, trade) {
  // seçili taşeronun saatlik adam-saat üretimi (paket boyunca sabit)
  const g = tasGroupOf(trade), firm = tasSel && tasSel[g]; if (!firm) return null;
  const ah = j.fazlar.filter(f => PAKET[g].trades.includes(f.trade)).reduce((s, f) => s + f.ah, 0);
  return { firm, power: ah / (firm.gun * HOURS_PER_DAY), costPerAh: firm.fiyat / ah };
}

function autoAlloc(S, j) {
  const alloc = j.fazlar.map(f => ({ trade: f.trade, kiralik: 1 }));
  for (let guard = 0; guard < 400; guard++) {
    const e = estimate(S, j, alloc);
    if (e.gun <= j.sure) break;
    let best = -1, bestH = 0;
    e.fazSaat.forEach((h, i) => { if (alloc[i].kiralik < (j.rep >= 3 || j.anahtar ? MAX_CREW : j.rep >= 2 ? 10 : 6) && h > bestH) { bestH = h; best = i; } });
    if (best < 0) break;
    alloc[best].kiralik++;

  return alloc;
}
function estimate(S, j, alloc, extraJobs = 1) {
  const of = overloadFactor({ ...S, active: S.active.concat(extraJobs ? [{}] : []) });
  if (j.tur === 'proje') {

    const saat = j.ah / sp;
    return { saat, gun: Math.ceil(saat / HOURS_PER_DAY - 1e-9), iscilik: 0, fazSaat: [saat] };
  }
  let saat = 0, iscilik = 0; const fazSaat = [];
  if (j.anahtar && j.projeAh) { const sp = teamSpeed(S, j, defaultTeam(S)) * of; saat += j.projeAh / (sp || 0.5); }
  j.fazlar.forEach((f, i) => {

function bindRisk(root, jobId, done) {

function krizDurum() { return S.money >= 0 ? `Kasa: <b class="pos">${fmt(S.money)}</b>. Kasa artıya geçti, kriz atlatıldı.` : `Kasa: <b class="neg">${fmt(S.money)}</b>. Üst üste 3 ay eksi kapatırsan ve kurtarma yolu kalmazsa iflas edersin.`; }

function bindRescue(root) {

  on('[data-parcel]', b => { const e = buyParcel(S, +b.dataset.parcel); toast(e || 'Arsa senin!'); renderSheet(); });
  on('[data-tempo]', b => { const [id, t] = b.dataset.tempo.split(':'); const d = S.devs.find(x => x.id === +id); d.tempo = +t; renderSheet(); });
  on('[data-price]', b => { const [id, p] = b.dataset.price.split(':'); const d = S.devs.find(x => x.id === +id); d.priceSet = +p; renderSheet(); });
  on('[data-presell]', b => { const e = presell(S, +b.dataset.presell); toast(e || 'Ön satış yapıldı'); renderSheet(); });
  on('[data-kredi]', b => { const e = krediCek(S, +b.dataset.kredi); toast(e || 'Kredi çekildi'); renderSheet(); });
  on('[data-kodeme]', b => { const e = krediOde(S, +b.dataset.kodeme); toast(e || 'Borç ödendi'); renderSheet(); });
  const ng = $('#newGame'); if (ng) ng.onclick = () => { if (ng.dataset.sure) { try { localStorage.removeItem(SAVE_KEY); } catch (x) {} closeSheet(); S = null; renderStart(); } else { ng.dataset.sure = 1; ng.textContent = 'Emin misin? Kayıt silinir — tekrar dokun'; } };
}

// ---------- Başlat
window.addEventListener('DOMContentLoaded', () => {
  S = load();
  if (S && S.v === 1 && !S.over) renderGame(); else { S = null; renderStart(); }
  lastTick = performance.now();
  setInterval(tick, 100);
  setInterval(() => { if (S && !paused()) save(); }, 5000);
});
</script>
</body>
</html>
